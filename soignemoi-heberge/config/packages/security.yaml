# config/packages/security.yaml
security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Entity\User: 'auto' # vérifier que User implémente PasswordAuthenticatedUserInterface

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email # Utilisez l'email comme identifiant

    firewalls:
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_home # Redirige vers cette route après une connexion réussie
            logout:
                path: app_logout

    access_control:
        - { path: ^/liste/sejours, roles: ROLE_USER }
        - { path: ^/formulaire/sejour, roles: ROLE_USER }
        